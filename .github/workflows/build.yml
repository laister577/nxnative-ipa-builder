name: Kid With Sword Remake - NUP to iOS IPA Builder

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Version du package dans le NUP (ex: v131072, ou laisser vide par défaut)"
        required: false
        type: string
        default: ""
      romfs_mode:
        description: "Mode RomFS (laisser 'embedded' par défaut, ou 'separate' si l'IPA est trop lourd)"
        required: false
        type: choice
        default: "embedded"
        options:
          - "embedded"
          - "separate"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout kid-with-sword-remake repository
        uses: actions/checkout@v4
        with:
          repository: cheemu21/kid-with-sword-remake
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies and Metal Toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd spirv-cross glslang unar
          python -m pip install --upgrade pip
          python -m pip install \
            lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd requests

      - name: Download 24GB NUP via Authenticated Google API
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          if [[ -z "${GAME_URL:-}" ]]; then
            echo "::error::Le secret Game_URL est vide."
            exit 1
          fi

          python3 -c '
          import os, re, sys, urllib.parse as u, requests

          url = os.environ["GAME_URL"].strip()
          token = os.environ.get("GDRIVE_TOKEN", "").strip().replace("\n", "").replace("\r", "")

          p = u.urlparse(url)
          q = u.parse_qs(p.query)
          m = re.search(r"/file/d/([^/]+)", p.path)
          file_id = m.group(1) if m else (q["id"][0] if "id" in q else (url if re.fullmatch(r"[-A-Za-z0-9_]{20,}", url) else None))

          if not file_id:
              print("::error::ID Google Drive introuvable dans l URL.")
              sys.exit(1)

          print(f"Téléchargement authentifié du fichier (ID: {file_id})...")
          headers = {"Authorization": f"Bearer {token}"} if token else {}
          
          download_url = f"https://www.googleapis.com/drive/v3/files/{file_id}?alt=media"
          response = requests.get(download_url, headers=headers, stream=True)

          if response.status_code != 200:
              print(f"::error::Erreur API Google Drive ({response.status_code}): {response.text}")
              sys.exit(1)

          output_path = os.path.join(sys.argv[1], "game.download")
          with open(output_path, "wb") as f:
              for chunk in response.iter_content(chunk_size=8*1024*1024):
                  if chunk:
                      f.write(chunk)
          print("Téléchargement complet réussi.")
          ' "$WORK"

          if [[ ! -s "$WORK/game.download" ]]; then
            echo "::error::Le fichier téléchargé est vide."
            exit 1
          fi
          file "$WORK/game.download"

      - name: Prepare NUP package (or extract if archived)
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python3 -c '
          import shutil, subprocess, sys
          from pathlib import Path
          src = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          with src.open("rb") as f:
              magic = f.read(8)
          if magic.startswith(b"Rar!\x1a\x07") or magic.startswith(b"PK\x03\x04"):
              print("Archive détectée, extraction en cours avec unar...")
              subprocess.run(["unar", "-f", "-o", str(game_dir), str(src)], check=True)
              nup_files = list(game_dir.rglob("*.nup"))
              if not nup_files:
                  raise SystemExit("Aucun fichier .nup trouvé dans l archive !")
              print(f"Fichier NUP extrait : {nup_files[0]}")
          else:
              target = game_dir / "game.nup"
              shutil.move(str(src), str(target))
              print(f"Fichier NUP prêt : {target}")
          ' "$WORK/game.download" "$GAME_DIR"

      - name: Build iOS IPA from NUP with Auto-Patching
        env:
          PACKAGE_VER: ${{ inputs.package_version }}
          ROMFS_MODE: ${{ inputs.romfs_mode }}
          ALLOW_OTHER_METAL: "True"
        shell: bash
        run: |
          set -euo pipefail
          LATEST_XCODE="$(ls -d /Applications/Xcode_27*.app /Applications/Xcode-27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "$LATEST_XCODE" ]]; then
            echo "Activation de $LATEST_XCODE..."
            sudo xcode-select -s "$LATEST_XCODE"
            xcodebuild -downloadComponent MetalToolchain || true
          fi

          GAME_DIR="$RUNNER_TEMP/GameFiles"
          NUP_FILE="$(find "$GAME_DIR" -name "*.nup" | head -n 1)"

          if [[ -z "$NUP_FILE" ]]; then
            echo "::error::Aucun fichier .nup trouvé dans $GAME_DIR"
            exit 1
          fi

          # Script de surveillance en arrière-plan pour corriger c1_guard.py à la volée s'il crashe
          (
            while true; do
              if [[ -f "scripts/dm/gfx/tools/c1_guard.py" ]]; then
                sed -i '' 's/\._m0\[int\(_204\)\]);/._m0[int(_204)]/g' "scripts/dm/gfx/tools/c1_guard.py" 2>/dev/null || true
              fi
              sleep 2
            done
          ) &
          MONITOR_PID=$!

          CMD=(python3 scripts/build_ipa_from_nsp.py "$NUP_FILE" --allow-other-metal)

          if [[ -n "${PACKAGE_VER:-}" ]]; then
            CMD+=(--package "$PACKAGE_VER")
          fi

          if [[ "${ROMFS_MODE:-embedded}" == "separate" ]]; then
            CMD+=(--romfs separate)
          fi

          echo "Exécution : ${CMD[*]}"
          set +e
          "${CMD[@]}"
          EXIT_CODE=$?
          set -e

          kill $MONITOR_PID 2>/dev/null || true
          exit $EXIT_CODE

      - name: Collect IPA Artifact
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUT_DIR="$RUNNER_TEMP/OutputIPA"
          mkdir -p "$OUT_DIR"

          find "$GAME_DIR" -maxdepth 3 -name "*.ipa" -exec cp -v {} "$OUT_DIR/" \;
          find . -maxdepth 3 -name "*.ipa" -exec cp -v {} "$OUT_DIR/" \;

          if [[ -z "$(ls -A "$OUT_DIR")" ]]; then
            echo "::error::Aucun fichier .ipa n'a été généré."
            exit 1
          fi

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ocarina-of-Time-iOS-IPA
          path: ${{ runner.temp }}/OutputIPA/*.ipa
          if-no-files-found: error
