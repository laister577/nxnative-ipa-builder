name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: d158df611bf2f3fa315c4f16585575cdfdb2a1d3

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross unar glslang
          python -m pip install --upgrade pip
          python -m pip install \
            lz4 "capstone>=5,<6" fonttools zbic backports.zstd gdown \
            google-auth requests

      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          # Authenticated Google Drive downloader (Drive API v3).
          # Credentials: service-account JSON or authorized-user token.json.
          cat > "$RUNNER_TEMP/gdrive_dl.py" <<'PY'
          import json
          import os
          import sys

          import requests
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2 import credentials, service_account

          file_id, output = sys.argv[1], sys.argv[2]
          scopes = ["https://www.googleapis.com/auth/drive.readonly"]
          raw = os.environ["GDRIVE_CREDENTIALS_JSON"].strip()

          if raw.startswith("ya29."):
              # Plain OAuth access token (valid ~1 hour)
              session = requests.Session()
              session.headers["Authorization"] = "Bearer " + raw
          else:
              info = json.loads(raw)
              if info.get("type") == "service_account":
                  creds = service_account.Credentials.from_service_account_info(
                      info, scopes=scopes
                  )
              else:
                  creds = credentials.Credentials.from_authorized_user_info(info)
              session = AuthorizedSession(creds)

          import time

          api = f"https://www.googleapis.com/drive/v3/files/{file_id}"
          common = {"supportsAllDrives": "true"}

          meta = session.get(
              api, params={**common, "fields": "name,size"}, timeout=60
          )
          if meta.status_code != 200:
              print(f"Drive API metadata error {meta.status_code}: {meta.text[:600]}")
              sys.exit(1)

          info_meta = meta.json()
          size = int(info_meta.get("size", 0))
          if size <= 0:
              print("Could not determine the file size from the Drive API.")
              sys.exit(1)

          print(f"Drive file: {info_meta.get('name')} ({size:,} bytes)")

          pos = 0
          failures = 0
          last_print = 0.0
          start = time.time()

          with open(output, "wb") as f:
              while pos < size:
                  progress_before = pos
                  try:
                      resp = session.get(
                          api,
                          params={**common, "alt": "media"},
                          headers={"Range": f"bytes={pos}-"},
                          stream=True,
                          timeout=(30, 120),
                      )

                      if resp.status_code == 401:
                          print("Drive API 401: the access token is invalid or expired.")
                          sys.exit(1)

                      if resp.status_code not in (200, 206):
                          raise RuntimeError(
                              f"HTTP {resp.status_code}: {resp.text[:300]}"
                          )

                      if resp.status_code == 200 and pos > 0:
                          # the server ignored Range: restart from zero
                          f.seek(0)
                          f.truncate()
                          pos = 0

                      for chunk in resp.iter_content(chunk_size=8 * 1024 * 1024):
                          if not chunk:
                              continue
                          f.write(chunk)
                          pos += len(chunk)
                          now = time.time()
                          if now - last_print > 15:
                              last_print = now
                              speed = pos / max(now - start, 1) / 1e6
                              print(
                                  f"  {pos / size * 100:5.1f}%  "
                                  f"{pos / 1e9:.2f}/{size / 1e9:.2f} GB  "
                                  f"{speed:.1f} MB/s",
                                  flush=True,
                              )
                  except SystemExit:
                      raise
                  except Exception as exc:
                      print(f"Download interrupted at {pos:,} bytes: {type(exc).__name__}: {str(exc)[:200]}", flush=True)

                  if pos >= size:
                      break

                  if pos > progress_before:
                      failures = 0
                  failures += 1
                  if failures > 20:
                      print("Too many consecutive failures; giving up.")
                      sys.exit(1)
                  wait = min(60, 5 * failures)
                  print(f"Resuming from {pos:,} bytes in {wait}s (attempt {failures}/20)...", flush=True)
                  time.sleep(wait)

          print(f"Drive API download complete: {pos:,} bytes")
          PY

          trim() { printf '%s' "$1" | tr -d '[:space:]"'"'"; }

          download_file() {
            local url output host file_id
            local re_file='/file/d/([-A-Za-z0-9_]+)'
            local re_id='[?&]id=([-A-Za-z0-9_]+)'
            local re_bare='^[-A-Za-z0-9_]{20,}$'

            url="$(trim "$1")"
            output="$2"
            file_id=""

            if [[ -z "$url" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            host="$(printf '%s' "$url" | sed -E 's#^[A-Za-z]+://([^/?]+).*#\1#')"
            echo "Downloading $(basename "$output") (source host: $host)..."

            if [[ "$url" == *"/folders/"* ]]; then
              echo "::error::$(basename "$output"): this is a Drive FOLDER link. Use a link to the file itself."
              exit 1
            fi

            if [[ "$host" == *google.com ]]; then
              if [[ "$url" =~ $re_file ]]; then
                file_id="${BASH_REMATCH[1]}"
              elif [[ "$url" =~ $re_id ]]; then
                file_id="${BASH_REMATCH[1]}"
              fi
              if [[ -z "$file_id" ]]; then
                echo "::error::Google link detected but no file ID found (host: $host)."
                exit 1
              fi
              if [[ -n "${GDRIVE_CREDENTIALS_JSON:-}" ]]; then
                echo "Using the authenticated Google Drive API..."
                if ! python -I "$RUNNER_TEMP/gdrive_dl.py" "$file_id" "$output"; then
                  echo "::warning::Drive API download failed; falling back to gdown."
                  rm -f "$output"
                  gdown "$file_id" -O "$output"
                fi
              else
                gdown "$file_id" -O "$output"
              fi
            elif [[ "$url" =~ $re_bare ]]; then
              if [[ -n "${GDRIVE_CREDENTIALS_JSON:-}" ]] \
                && python -I "$RUNNER_TEMP/gdrive_dl.py" "$url" "$output"; then
                :
              else
                rm -f "$output"
                gdown "$url" -O "$output"
              fi
            elif [[ "$url" =~ ^https?:// ]]; then
              curl -L --fail --retry 3 -o "$output" "$url"
            else
              echo "::error::Unrecognized URL format (host: $host)."
              exit 1
            fi

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            file "$output"
          }

          GAME_URL="$(trim "${GAME_URL:-}")"
          UPDATE_URL="$(trim "${UPDATE_URL:-}")"
          DLC_URL="$(trim "${DLC_URL:-}")"
          KEYS_URL="$(trim "${KEYS_URL:-}")"

          download_file "$GAME_URL" "$WORK/game.download"
          download_file "$KEYS_URL" "$WORK/prod.keys"

          if [[ -n "$UPDATE_URL" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No UPDATE_URL configured; continuing without an update."
          fi

          if [[ -n "$DLC_URL" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi

          chmod 600 "$WORK/prod.keys"

      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz"
          }
          rar_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
          )

          def validate_package(path):
              with path.open("rb") as f:
                  magic = f.read(4)

              suffix = path.suffix.lower()

              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

              if suffix in (".xci", ".xcz") and magic != b"HEAD":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

          def add_package(source, label):
              target = game_dir / source.name

              if target.exists():
                  raise SystemExit(
                      "Duplicate package filename: " + source.name
                  )

              validate_package(source)
              shutil.copy2(source, target)

              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )

          def process_download(label):
              source = work / f"{label}.download"

              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return

              with source.open("rb") as f:
                  signature = f.read(8)

              is_rar = any(
                  signature.startswith(magic)
                  for magic in rar_signatures
              )

              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)

                  print(f"{label}: RAR archive detected; extracting.")

                  subprocess.run(
                      [
                          "unar",
                          "-o",
                          str(extract_dir),
                          str(source),
                      ],
                      check=True,
                  )

                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in package_extensions
                  )

                  if not packages:
                      raise SystemExit(
                          f"No NSP/XCI/NSZ/XCZ packages found "
                          f"in the {label} RAR archive."
                      )

                  for package in packages:
                      add_package(package, label)

              else:
                  print(
                      f"{label}: not a RAR archive; "
                      "checking as a direct package."
                  )

                  if signature[:4] == b"PFS0":
                      extension = ".nsp"
                  elif signature[:4] == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR archive "
                          "or direct NSP/XCI package. "
                          "Direct downloads must be NSP or XCI files."
                      )

                  target = game_dir / f"{label}{extension}"

                  if target.exists():
                      raise SystemExit(
                          f"Output package already exists: {target.name}"
                      )

                  shutil.copy2(source, target)
                  validate_package(target)

                  print(
                      f"Added direct package: {target.name} "
                      f"({target.stat().st_size:,} bytes)"
                  )

          process_download("game")
          process_download("update")
          process_download("dlc")

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )

          if not packages:
              raise SystemExit("No game packages were prepared.")

          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

          test -s "$WORK/prod.keys"

      - name: Detect game title ID and select shader profile
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)

                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []

                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )

                      if count > 100000 or string_size > 100000000:
                          return []

                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)

                      if len(entries) != count * 0x18:
                          return []

                      names = []

                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]

                          if offset >= len(strings):
                              continue

                          end = strings.find(b"\0", offset)

                          if end < 0:
                              continue

                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )

                      return names

              except (OSError, struct.error):
                  return []

          candidates = set()

          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )

                  if match:
                      title_id = int(match.group(1), 16)

                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )

              if match:
                  title_id = int(match.group(1), 16)

                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP and its ticket/filename."
              )

          print(next(iter(candidates)))
          PY
          )"

          PROFILE_ID="${PROFILE_OVERRIDE:-$DETECTED_ID}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]')"

          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi

          echo "Detected base title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      - name: Update shader toolchain lock and header
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing shader toolchain for profile $DM_GAME"

          CHAIN_SCRIPT="$(
            find . -name dmsh_chain.py -type f -print -quit
          )"

          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi

          TOOLS_DIR="$(dirname "$CHAIN_SCRIPT")"

          if [[ -f "$TOOLS_DIR/tool_lock.py" ]]; then
            echo "Standard layout: using tool_lock.py"
            python "$TOOLS_DIR/tool_lock.py" --update-lock
          else
            echo "Legacy layout: using dmsh_chain.py"
            python "$CHAIN_SCRIPT" --update-lock
          fi

          python "$CHAIN_SCRIPT" --header

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
